name: Trading Bola Menit 60 Bot

on:
  schedule:
    # Berjalan otomatis setiap 5 menit
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Mencegah dua proses scan berjalan bersamaan
concurrency:
  group: skor60-trading-scan-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan_and_settle:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests Before Execution
        run: |
          pytest -q

      - name: Execute Single Scan & Settlement Cycle
        env:
          TZ: "Asia/Makassar"
        run: |
          python check_once.py --json

      - name: Commit and Push Updated Database Safely (No Force Push, No Auto-Overwrite)
        run: |
          git config user.name "skor60-audit-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data pada siklus ini."
            exit 0
          fi

          git commit -m "chore(data): update trading records $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Retry push dengan verifikasi konflik ketat (tanpa --force dan tanpa -X theirs)
          MAX_RETRIES=3
          COUNT=1
          while [ $COUNT -le $MAX_RETRIES ]; do
            echo "Push attempt $COUNT of $MAX_RETRIES..."
            if git push origin HEAD:main; then
              echo "Push berhasil."
              exit 0
            fi

            echo "Push gagal karena pembaruan remote. Memeriksa apakah terjadi konflik database..."
            git fetch origin main
            # Cek apakah dapat di-rebase secara bersih tanpa kehilangan data
            if ! git rebase origin/main; then
              echo "CRITICAL: Konflik database terdeteksi! Menghentikan rebase dan membatalkan penulisan otomatis untuk menjaga integritas audit."
              git rebase --abort || true
              exit 1
            fi
            COUNT=$((COUNT + 1))
            sleep 2
          done

          echo "Gagal melakukan push setelah $MAX_RETRIES percobaan."
          exit 1
