
name: Bot Skor Menit 60
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: skor60-220-parallel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Fix DNS + Show Time WITA
        run: |
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "UTC: $(date -u)"
          echo "WITA: $(TZ='Asia/Makassar' date)"
      
      - name: Install deps
        run: pip install -r requirements.txt
      
      - name: Run bot V8.8 220 LIGA PARALLEL UNLIMITED
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "=== START SCAN 220 LIGA PARALLEL UNLIMITED ==="
          echo "UTC: $(date -u) | WITA: $(TZ='Asia/Makassar' date)"
          python check_once.py
          echo "=== END ==="
          echo "=== Files created ==="
          ls -lh data/ || echo "no data"
          ls -lh data/archive/ || echo "no archive"
          cat data/matches.json | head -20
      
      - name: Commit UNLIMITED - FORCE ADD bypass .gitignore
        run: |
          git config user.name "bot-skor60"
          git config user.email "bot@skor60.com"
          echo "=== .gitignore check ==="
          cat .gitignore || echo "no .gitignore"
          echo "=== Force add with -f to bypass .gitignore ==="
          git add -f data/matches.json || git add -f data/ || true
          git add -f data/archive/ || true
          git status
          if git diff --staged --quiet; then
            echo "No changes - skip commit"
          else
            echo "Committing changes..."
            git commit -m "V8.8 FIX WEB KOSONG - FORCE ADD data/ $(date -u +%Y-%m-%d_%H:%M_UTC) [skip ci]"
            git push || (sleep 10 && git push) || true
          fi
