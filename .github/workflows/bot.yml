name: Trading Bola Menit 60 Bot
          PYTHONPATH=. pytest -q
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: skor60-trading-scan-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan_and_settle:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests Before Execution
        run: |
          pytest -q

      - name: Execute Single Scan & Settlement Cycle
        env:
          TZ: "Asia/Makassar"
        run: |
          python check_once.py --json

      - name: Commit and Push Updated Database Safely
        run: |
          git config user.name "skor60-audit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
            exit 0
          fi
          git commit -m "chore(data): update trading records $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:main
