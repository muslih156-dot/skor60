name: Bot Skor Menit 60
on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Fix DNS
        run: |
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          cat /etc/resolv.conf
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run bot V8.5 MONTHLY ARCHIVE
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check_once.py
      - name: Commit JSON + Archive
        run: |
          git config user.name "bot-skor60"
          git config user.email "bot@skor60.com"
          git add data/matches.json data/archive/ || true
          git diff --staged --quiet || git commit -m "Update matches.json + monthly archive V8.5 [skip ci]"
          git push || echo "No changes"
