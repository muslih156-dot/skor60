
name: Bot Skor Menit 60
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skor60-v89-batch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Fix DNS + Show Time
        run: |
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "UTC: $(date -u) | WITA: $(TZ='Asia/Makassar' date)"
      
      - name: Install deps
        run: pip install -r requirements.txt
      
      - name: Run bot V8.9 BATCH FIX
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "=== START V8.9 BATCH FIX ==="
          python check_once.py
          echo "=== Files ==="
          ls -lh data/ || echo "no data"
          ls -lh data/archive/ || echo "no archive"
          cat data/matches.json || echo "no file"
      
      - name: Commit - FORCE ADD bypass gitignore
        run: |
          git config user.name "bot-skor60"
          git config user.email "bot@skor60.com"
          echo "=== FORCE ADD ==="
          git add -f data/matches.json
          git add -f data/archive/ || true
          git status
          git diff --staged --stat
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "V8.9 FIX BATCH - $(date -u +%Y-%m-%d_%H:%M_UTC) - 2 matches no overwrite [skip ci]"
            echo "=== Pushing with token ==="
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
            echo "=== Push done ==="
          fi
