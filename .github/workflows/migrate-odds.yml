name: Migrasi Odds Lama Sim ke Est

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run Migrasi V6
        run: python migrate_old_odds.py

      - name: Commit hasil migrasi
        run: |
          git config user.name "bot-migrasi"
          git config user.email "bot@migrasi.local"
          git add data/
          git diff --cached --quiet || git commit -m "Migrasi V6: Actual -> Est manual + fix Profit Rp0"
          git push
