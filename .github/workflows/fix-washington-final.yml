name: Fix Washington Actual ke Sim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Washington Actual -> Sim, odds + profit JANGAN diubah
        run: |
          python3 << 'PY'
          import json, os, glob
          for fpath in ["data/matches.json"] + sorted(glob.glob("data/archive/daily/*.json")):
              if not os.path.exists(fpath): continue
              with open(fpath, encoding="utf-8") as f: data=json.load(f)
              recs=None; key=None
              if isinstance(data, list): recs=data
              elif isinstance(data, dict):
                  for k in ["matches","records","data"]:
                      if k in data and isinstance(data[k], list):
                          recs=data[k]; key=k; break
              if recs is None: continue
              changed=0
              for r in recs:
                  if str(r.get("match_id",""))=="401931279":
                      print(f"SEBELUM: odds={r.get('odds_entry')} source={r.get('odds_source')} profit={r.get('profit')}")
                      # Cuma ganti labelnya, odds 1.72 dan profit 36rb DIBIARIN
                      r["odds_source"]="Sim"; r["odds_entry_type"]="Sim"; r["odds_type"]="Sim"
                      print(f"SESUDAH: odds={r.get('odds_entry')} source={r.get('odds_source')} profit={r.get('profit')} -> odds + profit DIBIARIN")
                      changed+=1
              if changed>0:
                  if key: data[key]=recs
                  else: data=recs
                  with open(fpath,"w",encoding="utf-8") as f: json.dump(data,f,indent=2,ensure_ascii=False)
                  print(f" -> {fpath}: {changed} diubah")
          print("Selesai")
          PY
      - name: Commit
        run: |
          git config user.name "bot-washington"
          git config user.email "bot@washington.local"
          git add -A
          git diff --cached --quiet || git commit -m "Washington 1.72 Actual->Sim, profit 36rb dibiarin"
          git pull --rebase origin main
          git push
