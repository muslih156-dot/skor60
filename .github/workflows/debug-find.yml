      - name: Cari file yang isinya 401931279
        run: |
          echo "=== Cari ID Washington vs Rutgers ==="
          grep -r "401931279" --include="*.json" . || echo "TIDAK KETEMU DI JSON"
          echo ""
          echo "=== Semua file json ==="
          find data -type f -name "*.json" | head -n 50
          echo ""
