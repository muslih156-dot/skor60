name: Debug Cari File Dashboard
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lihat 1 record matches.json
        run: |
          python3 -c "
          import json
          with open('data/matches.json') as f:
              d=json.load(f)
          # Cek struktur
          print('Tipe data:', type(d))
          if isinstance(d, dict):
              print('Keys:', list(d.keys())[:10])
              for k,v in d.items():
                  if isinstance(v, list) and len(v)>0:
                      print(f'Key list: {k} | Jumlah: {len(v)}')
                      print('Contoh 1 record:')
                      print(json.dumps(v[0], indent=2, ensure_ascii=False)[:3000])
                      break
          elif isinstance(d, list):
              print('Jumlah:', len(d))
              print(json.dumps(d[0], indent=2, ensure_ascii=False)[:3000])
          "
      - name: Lihat 1 record archive daily
        run: |
          python3 -c "
          import json
          with open('data/archive/daily/2026-11-11.json') as f:
              d=json.load(f)
          print('Tipe:', type(d))
          if isinstance(d, dict):
              print('Keys:', list(d.keys())[:10])
          import json as j
          rec = d[0] if isinstance(d, list) else d.get('records',[{}])[0]
          print(j.dumps(rec, indent=2, ensure_ascii=False)[:3000])
          "
