name: Fix Mesin Washington Actual ke Sim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 1. Cek siapa yang nulis Actual di code
        run: |
          echo "=== Di check_once.py ==="
          grep -n "Actual" check_once.py || echo "tidak ada Actual di check_once"
          echo "=== Di app.py ==="
          grep -n "Actual" app.py | head -n 20 || echo "tidak ada Actual di app.py"
      - name: 2. Tambal mesinnya - Actual jadi Sim di code
        run: |
          python3 << 'PY'
          for fname in ["check_once.py", "app.py"]:
              try:
                  with open(fname, encoding="utf-8", errors="ignore") as f: txt=f.read()
              except: continue
              asli=txt
              # Di code, semua yang nulis Actual diganti Sim
              # Tapi jangan ubah kata di komentar / penjelasan aja, yang penting logic-nya
              txt=txt.replace('"Actual"', '"Sim"').replace("'Actual'", "'Sim'")
              txt=txt.replace('odds_source="Actual"', 'odds_source="Sim"')
              txt=txt.replace("odds_source='Actual'", "odds_source='Sim'")
              if txt!=asli:
                  with open(fname,"w",encoding="utf-8") as f: f.write(txt)
                  print(f" -> {fname} DITAMBAL")
              else:
                  print(f" -> {fname} sudah bersih / tidak ada Actual")
          PY
          echo "=== Cek lagi, masih ada Actual di code? ==="
          grep -n '"Actual"\|'"'"'Actual'"'"'' check_once.py app.py || echo "BERSIH, mesin udah nggak nulis Actual lagi"
      - name: 3. Fix data Washington sekali lagi + kunci
        run: |
          python3 << 'PY'
          import json, os, glob
          for fpath in ["data/matches.json"] + sorted(glob.glob("data/archive/daily/*.json")):
              if not os.path.exists(fpath): continue
              with open(fpath, encoding="utf-8") as f: data=json.load(f)
              recs=None; key=None
              if isinstance(data, list): recs=data
              elif isinstance(data, dict):
                  for k in ["matches","records","data"]:
                      if k in data and isinstance(data[k], list):
                          recs=data[k]; key=k; break
              if recs is None: continue
              changed=0
              for r in recs:
                  if str(r.get("match_id",""))=="401931279":
                      r["odds_source"]="Sim"; r["odds_entry_type"]="Sim"; r["odds_type"]="Sim"
                      print(f"Washington di {fpath} -> Sim, odds tetap {r.get('odds_entry')}, profit tetap {r.get('profit')}")
                      changed+=1
              if changed>0:
                  if key: data[key]=recs
                  else: data=recs
                  with open(fpath,"w",encoding="utf-8") as f: json.dump(data,f,indent=2,ensure_ascii=False)
          print("Selesai")
          PY
      - name: Commit
        run: |
          git config user.name "bot-mesin"
          git config user.email "bot@mesin.local"
          git add -A
          git diff --cached --quiet || git commit -m "Tambal mesin: check_once + app Actual->Sim, biar nggak balik lagi"
          git pull --rebase origin main
          git push
