name: Fix Judul Dashboard Actual -> Est

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cari kata Actual di app.py
        run: |
          echo "=== Baris yang ada kata Actual di app.py ==="
          grep -n "Actual\|actual" app.py || echo "TIDAK KETEMU Actual di app.py"
          echo ""
          echo "=== Cari di semua file .py ==="
          grep -rn "Entry Odds" --include="*.py" . || echo "Tidak ketemu Entry Odds"
      - name: Ganti Actual -> Est di app.py
        run: |
          # Ganti judul kolom aja, jangan ganti yang lain
          sed -i 's/Entry Odds (Actual)/Entry Odds (Est)/g' app.py
          sed -i 's/Entry Odds.*Actual/Entry Odds (Est)/g' app.py
          sed -i 's/(Actual)/(Est)/g' app.py
          echo "=== Hasil sesudah diganti ==="
          grep -n "Entry Odds" app.py || echo "Cek manual"
          git config user.name "bot-fix"
          git config user.email "bot@fix.local"
          git add app.py
          git diff --cached --quiet || git commit -m "Fix judul dashboard Actual -> Est"
          git pull --rebase origin main
          git push
