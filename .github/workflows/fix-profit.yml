name: Fix Profit Rp0 + Actual ke Sim

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actual -> Sim + Hitung ulang profit
        run: |
          python3 << 'PY'
          import json, os, glob
          targets = ["data/matches.json"] + sorted(glob.glob("data/archive/daily/*.json"))
          for fpath in targets:
              if not os.path.exists(fpath): continue
              with open(fpath, encoding="utf-8") as f: data=json.load(f)
              recs=None; key=None
              if isinstance(data, list): recs=data
              elif isinstance(data, dict):
                  for k in ["matches","records","data"]:
                      if k in data and isinstance(data[k], list):
                          recs=data[k]; key=k; break
              if recs is None: continue
              changed=0
              for r in recs:
                  # 1. Jangan timpa odds-nya, cuma ganti labelnya
                  src=str(r.get("odds_source","") or r.get("odds_entry_type",""))
                  if src.lower()=="actual":
                      r["odds_source"]="Sim"
                      r["odds_entry_type"]="Sim"
                      r["odds_type"]="Sim"
                      changed+=1
                  # 2. Hitung ulang profit dari Result, jangan dari odds
                  res=str(r.get("result","") or r.get("outcome","") or r.get("status_result","")).upper()
                  # Kalau Final Score udah ada, tentuin WIN/LOSE dari skor juga
                  if res in ("WIN","LOSE"):
                      want = 40000 if res=="WIN" else -50000
                      if r.get("profit") != want:
                          print(f"  [PROFIT] {r.get('match_id')} {r.get('home_team')} {res} : {r.get('profit')} -> {want}")
                          r["profit"]=want
                          r["profit_idr"]=want
                          changed+=1
              if changed>0:
                  if key: data[key]=recs
                  else: data=recs
                  with open(fpath,"w",encoding="utf-8") as f: json.dump(data,f,indent=2,ensure_ascii=False)
                  print(f" -> {fpath}: {changed} diubah")
          print("Selesai")
          PY
      - name: Commit
        run: |
          git config user.name "bot-profit"
          git config user.email "bot@profit.local"
          git add -A
          git diff --cached --quiet || git commit -m "Actual->Sim + balikin profit WIN 40rb LOSE -50rb"
          git pull --rebase origin main
          git push
